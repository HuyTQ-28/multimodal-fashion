services:
  redis:
    image: redis:7-alpine
    container_name: freedom_rt_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: freedom_rt_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

volumes:
  redis_data:

